# Prospector display: use fixed brightness until the optional light sensor is confirmed.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_ZMK_BACKLIGHT=n

# Enable LVGL widgets used by the Prospector default Classic status screen.
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_ROLLER=y
