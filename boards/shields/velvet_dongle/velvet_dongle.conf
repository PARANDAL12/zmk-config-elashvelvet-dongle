# The dongle has no keyboard backlight hardware.
CONFIG_ZMK_BACKLIGHT=n

# Receive split trackball pointer events on the central dongle.
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Read the host's USB Caps Lock LED state for the status-screen indicator.
CONFIG_ZMK_HID_INDICATORS=y
