# Velvet + XIAO BLE central dongle (trackball relay + DYA Studio + Prospector display)
---
include:
  - board: xiao_ble//zmk
    shield: velvet_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_BACKLIGHT=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: velvet_dongle_basic
  - board: nice_nano//zmk
    shield: velvet_left nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: velvet_left
  - board: nice_nano//zmk
    shield: velvet_right nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: velvet_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao_ble
