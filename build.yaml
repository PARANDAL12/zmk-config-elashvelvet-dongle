# Prospector integration test build matrix
# Existing keyboard halves become BLE peripherals; XIAO dongle is central.
---
include:
  - board: xiao_ble//zmk
    shield: velvet_dongle prospector_adapter
    artifact-name: prospector_dongle
  - board: nice_nano//zmk
    shield: velvet_left nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: velvet_left
  - board: nice_nano//zmk
    shield: velvet_right nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: velvet_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao_ble
